# GLM-5.1 — option A: vllm-ascend W8A8 quantized (reduced 20-layer ckpt) vs
# transformers bf16 reference (num_layers_override=20 from original 1.4TB).
# W8A8 avoids aclnnAddRmsNormBias (uses npu_add_rms_norm_quant).
# Pod: vllm0202 (vllm-ascend 0.20.2, VLLM_VERSION=0.20.2).

model:
  name: GLM-5.1
  hf_model_path: /a3_inference/itask/workdir/models/GLM-5.1-bf16
  architecture: glm
  trust_remote_code: true
  num_layers_override: 2

precision:
  dtype: bfloat16
  attn_implementation: eager
  enforce_eager: true
  quantization_config: null
  tp_size: 1
  dp_size: 1
  max_model_len: 4096

# vllm-ascend side: 2-layer reduced checkpoint, TP=1 (no merge)
sides:
  vllm_ascend:
    hf_model_path: /data/glm51_2l
    quantization_config: null

hook_spec: models/hooks/glm.yaml

prompt: "Hello, how are you?"
max_new_tokens: 8

vllm:
  versions:
    "0.20.2":
      pythonpath: []
      env: {}

compare:
  thresholds:
    cosine: 0.95
    abs_mean_rel_diff: 0.05
    norm_rel_diff: 0.05

output_dir: ./dumped

env:
  ASCEND_DEVICE_ID: "0"
  VLLM_VERSION: "0.20.2"
  VLLM_ALLOW_INSECURE_SERIALIZATION: "1"
