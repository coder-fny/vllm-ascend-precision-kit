# GLM-5.2 BF16 (gold reference) — 10-layer reduced, transformers side.
# Compare target: bf16 gold vs W4A8/W4A8C8/W8A8 quantized (vllm-ascend).

model:
  name: GLM-5.2-BF16-10L
  hf_model_path: /home/admin/model-csi/models/modelhub_58600037_glm-5-2-133900141_20260714215107/model
  architecture: glm
  trust_remote_code: true
  num_layers_override: 10

precision:
  dtype: bfloat16
  attn_implementation: eager
  enforce_eager: true
  quantization_config: null
  tp_size: 1
  dp_size: 1
  max_model_len: 4096

hook_spec: models/hooks/glm.yaml

prompt: "The quick brown fox jumps over the lazy dog. The capital of France is"
max_new_tokens: 8

compare:
  thresholds:
    cosine: 0.95
    abs_mean_rel_diff: 0.05
    norm_rel_diff: 0.05

output_dir: ./dumped

env:
  ASCEND_DEVICE_ID: "0"
  VLLM_VERSION: "0.23.0"
  VLLM_ALLOW_INSECURE_SERIALIZATION: "1"
