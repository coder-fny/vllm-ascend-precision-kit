# GLM-5.2 W4A8, 20-layer (pre-built reduced ckpt) — A/B precision for PR #15077.
# EP-on + enable_fused_mc2=1 so that with #15077 REVERTED, use_cann_megamoe()=True
# (CANN MegaMoE fused kernel); with #15077 APPLIED (return False) -> MC2/grouped_matmul.
# Pre-built 20-layer ckpt (v0.26.0/glm52_w4a8_20l) avoids per-run re-reduce.
# Toggle #15077 in vllm_ascend/ascend_forward_context.py between dumps:
#   state A (before): revert the `return False` line  (MegaMoE ON)
#   state B (after) : current HEAD fa3537f92           (MegaMoE OFF)
# Deterministic by default: bit-identical controls so A-vs-B isolates the kernel
# switch (HCCL_DETERMINISTIC etc.). Override with a non-deterministic run if needed.
deterministic: true
model:
  name: GLM-5.2-W4A8-MegaMoE-AB
  hf_model_path: /a3_inference/itask/workdir/shared/fny02324681/GLM5.2_30ms/v0.26.0/glm52_w4a8_20l
  architecture: glm
  trust_remote_code: true
precision:
  dtype: bfloat16
  attn_implementation: eager
  enforce_eager: true
  quantization_config: ascend
  tp_size: 8
  dp_size: 1
  max_model_len: 32768
  enable_expert_parallel: true
  additional_config:
    enable_fused_mc2: 1
hook_spec: models/hooks/glm.yaml
prompt: "The quick brown fox jumps over the lazy dog. The capital of France is"
max_new_tokens: 8
compare:
  thresholds:
    cosine: 0.95
    abs_mean_rel_diff: 0.05
    norm_rel_diff: 0.05
output_dir: ./dumped
env:
  ASCEND_DEVICE_ID: "0,1,2,3,4,5,6,7"
  VLLM_ALLOW_INSECURE_SERIALIZATION: "1"
