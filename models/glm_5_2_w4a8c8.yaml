# GLM-5.2 W4A8C8 — cross-quant compare: W4A8 vs W4A8C8 (both vllm-ascend 0.23).
# This yaml = W4A8C8 side. Enable sparse SFA C8 KV-cache path via additional_config.
# quant_model_description.json reports W8A8_DYNAMIC (same scheme), but C8 path uses
# int8 KV cache + sparse flash attention C8 variant.
# Pod: vllm0202 (vllm 0.23 + vllm-ascend 0.23 editable). Weights on pod local.

model:
  name: GLM-5.2-W4A8C8
  hf_model_path: /home/admin/model-csi/models/modelhub_63200010_glm-5-2-w4a8c8-135400046_20260720103657/model
  architecture: glm
  trust_remote_code: true

precision:
  dtype: bfloat16
  attn_implementation: eager
  enforce_eager: true
  quantization_config: ascend    # reads quant_model_description.json -> W8A8_DYNAMIC
  tp_size: 8
  dp_size: 1
  max_model_len: 4096
  enable_expert_parallel: false
  additional_config:
    enable_sparse_sfa_c8: true   # W4A8C8: enable sparse SFA C8 KV-cache path

hook_spec: models/hooks/glm.yaml

prompt: "The quick brown fox jumps over the lazy dog. The capital of France is"
max_new_tokens: 8

compare:
  thresholds:
    cosine: 0.95
    abs_mean_rel_diff: 0.05
    norm_rel_diff: 0.05

output_dir: ./dumped

env:
  ASCEND_DEVICE_ID: "0,1,2,3,4,5,6,7"
  VLLM_VERSION: "0.23.0"
  VLLM_ALLOW_INSECURE_SERIALIZATION: "1"
