# GLM-5.2 W4A8C8 20-layer — vllm-ascend, TP=8, medical prompt, enable_sparse_sfa_c8.
model:
  name: GLM-5.2-W4A8C8-20L
  hf_model_path: /a3_inference/itask/workdir/fny02324681/models/glm52_w4a8c8_20l
  architecture: glm
  trust_remote_code: true

precision:
  dtype: bfloat16
  attn_implementation: eager
  enforce_eager: true
  quantization_config: ascend
  tp_size: 8
  dp_size: 1
  max_model_len: 4096
  enable_expert_parallel: false
  additional_config:
    enable_sparse_sfa_c8: true

hook_spec: models/hooks/glm.yaml

prompt: "Here are some examples of how to answer similar questions:\n\nWhat is the embryological origin of the hyoid bone?\nA) The first pharyngeal arch\nB) The first and second pharyngeal arches\nC) The second pharyngeal arch\nD) The second and third pharyngeal arches\nANSWER: D\n\nWhich of these branches of the trigeminal nerve contain somatic motor processes?\nA) The supraorbital nerve\nB) The infraorbital nerve\nC) The mental nerve\nD) None of the above\nANSWER: D\n\nThe pleura\nA) have no sensory innervation.\nB) are separated by a 2 mm space.\nC) extend into the neck.\nD) are composed of respiratory epithelium.\nANSWER: C\n\nIn Angle's Class II Div 2 occlusion there is\nA) excess overbite of the upper lateral incisors.\nB) negative overjet of the upper central incisors.\nC) excess overjet of the upper lateral incisors.\nD) excess overjet of the upper central incisors.\nANSWER: C\n\nWhich of the following is the body cavity that contains the pituitary gland?\nA) Abdominal\nB) Cranial\nC) Pleural\nD) Spinal\nANSWER: B\n\nAnswer the following multiple choice question. The last line of your response should be of the following format: 'ANSWER: [LETTER]' (without quotes) where [LETTER] is one of A,B,C,D. Think step by step before answering.\n\nWhich of the following structures is derived from ectomesenchyme?\n\nA) Motor neurons"
max_new_tokens: 8

compare:
  thresholds:
    cosine: 0.95
    abs_mean_rel_diff: 0.05
    norm_rel_diff: 0.05

output_dir: ./dumped

env:
  ASCEND_DEVICE_ID: "0,1,2,3,4,5,6,7"
  VLLM_VERSION: "0.23.0"
  VLLM_ALLOW_INSECURE_SERIALIZATION: "1"
