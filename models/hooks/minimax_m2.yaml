# HookSpec for MiniMaxM2 (MiniMaxM2ForCausalLM).
# MoE: vllm names it `block_sparse_moe` (MiniMaxM2MoE), HF names it `mlp`
# (MiniMaxM2SparseMoeBlock) -> per-side override. Fused qkv_proj (q/k/v skip) +
# q_norm/k_norm (per-head RMSNorm). down_proj lives inside MoE experts (not a
# directly hookable module) so it's omitted. ln2_in reconstructed by runner.
architecture: minimax_m2
num_layers_from: config.num_hidden_layers

hook_points:
  # --- module boundaries ---
  - {id: "layers.{L}.ln1_in",   module: "model.layers.{L}.input_layernorm",          capture: input,  replicated: true}
  - {id: "layers.{L}.attn_out", module: "model.layers.{L}.self_attn",                capture: output, replicated: true}
  - {id: "layers.{L}.ln2_in",   module: "model.layers.{L}.post_attention_layernorm", capture: input,  replicated: true}
  - {id: "layers.{L}.ln2_out",  module: "model.layers.{L}.post_attention_layernorm", capture: output, replicated: true}
  - {id: "layers.{L}.mlp_out",  module: "model.layers.{L}.mlp",                      capture: output, replicated: true}
  - {id: "final_norm",          module: "model.norm",                                capture: output, replicated: true}
  - {id: "logits",              module: "lm_head",                                   capture: output, replicated: true}

  # --- accessible op boundaries (qkv fused -> skip q/k/v; o_proj + qk_norm separate) ---
  - {id: "layers.{L}.q_norm.out",  module: "model.layers.{L}.self_attn.q_norm",  capture: output, replicated: true}
  - {id: "layers.{L}.k_norm.out",  module: "model.layers.{L}.self_attn.k_norm",  capture: output, replicated: true}
  - {id: "layers.{L}.o_proj.in",   module: "model.layers.{L}.self_attn.o_proj",  capture: input,  replicated: false}
  - {id: "layers.{L}.o_proj.out",  module: "model.layers.{L}.self_attn.o_proj",  capture: output, replicated: true}

# vllm-ascend: MoE module is `block_sparse_moe` (not `mlp`). Applies to all versions.
# Also hook `block_sparse_moe.gate` (router logits, fp32) + expert gmm1+swiglu op
# (per-rank op hook, to locate expert-internal divergence without cross-rank merge issues).
overrides:
  vllm_ascend:
    "":
      hook_points:
        - {id: "layers.{L}.mlp_out", module: "model.layers.{L}.block_sparse_moe", capture: output, replicated: true}
        - {id: "layers.{L}.router.out", module: "model.layers.{L}.block_sparse_moe.gate", capture: output, replicated: true}
        # op hook: dump npu_dynamic_quant input (post-routing float hidden_states)
        # + gmm1+swiglu I/O. npu_dynamic_quant is called via torch_npu (in
        # token_dispatcher.py, during MoEInitRouting dispatch), NOT via DeviceOperator.
        - {id: "expert_dynquant_in", op: "torch_npu.npu_dynamic_quant", capture: input,  call_index: "0-7"}
        - {id: "expert_swiglu_in",  op: "vllm_ascend.device.device_op.DeviceOperator.npu_grouped_matmul_swiglu_quant", capture: input,  call_index: "0-7"}
        - {id: "expert_swiglu_out", op: "vllm_ascend.device.device_op.DeviceOperator.npu_grouped_matmul_swiglu_quant", capture: output, call_index: "0-7"}

# Modifiers (yaml-declared patches, applied before hooks). Uncomment to enable.
# - disable swiglu_limit (test if it's root cause): set swiglu_limit=0 on all MoE layers
# modifiers:
#   - {action: set_attr, target: "model.layers.{L}.block_sparse_moe", attr: swiglu_limit, value: 0}
