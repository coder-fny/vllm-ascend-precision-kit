# Qwen3-30B-A3B (MoE, 48 layers, 128 experts) — verification model on mm-bench-a3
# Real Qwen3 architecture; layernorm/attention boundaries match qwen3 HookSpec.
# Dense-MLP projection hooks skip on MoE (mlp is MoE block) — expected.
# Selected via --model qwen3_30b_a3b

model:
  name: Qwen3-30B-A3B
  hf_model_path: /mnt/sfs_turbo/models/Qwen3-30B-A3B
  architecture: qwen3

precision:
  dtype: bfloat16
  attn_implementation: eager
  enforce_eager: true
  quantization_config: null
  tp_size: 1
  dp_size: 1

hook_spec: models/hooks/qwen3.yaml

prompt: "The quick brown fox jumps over the lazy dog. The capital of France is"
max_new_tokens: 8

vllm:
  versions:
    "0.21.1":
      pythonpath: []
      env: {}

compare:
  thresholds:
    cosine: 0.95
    abs_mean_rel_diff: 0.05
    norm_rel_diff: 0.05

output_dir: ./dumped

# 4 cards for device_map="auto" sharding (30B MoE ~60GB bf16)
# VLLM_VERSION selects vllm-ascend's version-compat branch (must match the
# supported vllm line, not the dev tag).
env:
  ASCEND_DEVICE_ID: "0,1,2,3"
  VLLM_VERSION: "0.21.0"
  VLLM_ALLOW_INSECURE_SERIALIZATION: "1"
