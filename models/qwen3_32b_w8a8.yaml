# Qwen3-32B — option A: vllm-ascend W8A8 quantized (reduced 2-layer ckpt) vs
# transformers bf16 reference (num_layers_override=2). Same base model.
# Dense Qwen3 (64 layers) -> 2-layer reduced fits single card.
# Selected via --model qwen3_32b_w8a8

model:
  name: Qwen3-32B
  hf_model_path: /home/admin/model-csi/models/modelhub_12000053_qwen3-32b-81500124_20250818202543/model
  architecture: qwen3
  trust_remote_code: true
  num_layers_override: 2

precision:
  dtype: bfloat16
  attn_implementation: eager
  enforce_eager: true
  quantization_config: null        # default (transformers bf16 reference)
  tp_size: 1
  dp_size: 1
  max_model_len: 4096

# vllm-ascend side: reduced W8A8 checkpoint (2 layers, ascend quant)
sides:
  vllm_ascend:
    hf_model_path: /data/qwen3_32b_w8a8_2l
    quantization_config: ascend    # AscendModelSlimConfig reads quant_model_description.json -> W8A8

hook_spec: models/hooks/qwen3.yaml

prompt: "The quick brown fox jumps over the lazy dog. The capital of France is"
max_new_tokens: 8

compare:
  thresholds:
    cosine: 0.95
    abs_mean_rel_diff: 0.05
    norm_rel_diff: 0.05

output_dir: ./dumped

env:
  ASCEND_DEVICE_ID: "0"
  VLLM_VERSION: "0.20.2"
  VLLM_ALLOW_INSECURE_SERIALIZATION: "1"
