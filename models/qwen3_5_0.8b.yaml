# Selected via --model qwen3_5_0.8b
# 用途：验证工具链路是否可用（小模型、单卡、无量化）

model:
  name: Qwen3.5-0.8B
  hf_model_path: /home/admin/model
  architecture: qwen3_5
  trust_remote_code: true

precision:
  dtype: bfloat16
  attn_implementation: eager
  enforce_eager: true
  quantization_config: null
  tp_size: 1
  dp_size: 1
  max_model_len: 4096
  enable_expert_parallel: false
  additional_config: {}

hook_spec: models/hooks/qwen3_5.yaml

prompt: "The quick brown fox jumps over the lazy dog. The capital of France is"
max_new_tokens: 8

compare:
  thresholds:
    cosine: 0.95
    abs_mean_rel_diff: 0.05
    norm_rel_diff: 0.05

output_dir: ./dumped/qwen3_5_0.8b

env:
  ASCEND_DEVICE_ID: "0"
  VLLM_ALLOW_INSECURE_SERIALIZATION: "1"
